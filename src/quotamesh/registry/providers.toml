# Stable connection metadata only. Do not use this as quota or pricing truth.
# Live-verified 2026-10-16 (docs/live-provider-notes.md): stream usage needs include_usage
# and arrives in a choices-less final chunk; GPT-5 models reject max_tokens.
[providers.openai]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
last_verified = "2026-10-16"
stream_usage = "inject"
token_param = "max_completion_tokens"

[providers.custom]
name = "Custom OpenAI-compatible"
base_url = ""
last_verified = "2026-10-02"

# Live-verified 2026-10-16 (docs/live-provider-notes.md): Bearer auth works for AQ. keys,
# usage rides on content chunks with include_usage, listings prefix ids with models/, and
# daily quotas reset at Pacific midnight per Google's rate-limit documentation.
[providers.gemini]
name = "Google Gemini (OpenAI compatibility)"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
last_verified = "2026-10-16"
stream_usage = "inject"
token_param = "max_completion_tokens"
model_list_prefix = "models/"
reset_rule = "midnight_pt"

