<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">QuotaMesh — local AI capacity wallet</title>
  <desc id="description">A local-first AI gateway connects project workloads to eligible AI API capacity with clear policy and spend boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c34"/>
      <stop offset="1" stop-color="#10112a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3d2"/>
      <stop offset="1" stop-color="#8ca6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(940 30) rotate(135) scale(480 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4567c8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4567c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#060a14" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <path d="M0 286C201 243 326 337 531 291s393-88 669-6" fill="none" stroke="#a3b8ff" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 312c192-41 335 44 528 2s409-88 672-13" fill="none" stroke="#75e4d3" stroke-opacity=".08" stroke-width="2"/>

  <g transform="translate(64 62)">
    <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="5">
      <path d="M16 30 48 14l31 24-22 39-41-7z"/>
      <path d="m16 30 41 47M48 14l-32 16m63 8L16 70" stroke-opacity=".72"/>
    </g>
    <g fill="#e9f1ff" stroke="#111b31" stroke-width="4">
      <circle cx="16" cy="30" r="8"/><circle cx="48" cy="14" r="8"/><circle cx="79" cy="38" r="8"/>
      <circle cx="57" cy="77" r="8"/><circle cx="16" cy="70" r="8"/>
    </g>
    <text x="104" y="31" fill="#dce7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3">QUOTAMESH</text>
    <text x="0" y="133" fill="#f7f9ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="700" letter-spacing="-1.2">Capacity with clear rules.</text>
    <text x="2" y="169" fill="#afbdd7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">A local control point for the AI API access you already own.</text>
    <g transform="translate(0 205)">
      <rect width="126" height="30" rx="15" fill="#75e4d3" fill-opacity=".14" stroke="#75e4d3" stroke-opacity=".35"/>
      <text x="63" y="20" text-anchor="middle" fill="#9ff1e5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">LOCAL-FIRST</text>
      <rect x="138" width="151" height="30" rx="15" fill="#9bafff" fill-opacity=".12" stroke="#9bafff" stroke-opacity=".32"/>
      <text x="213.5" y="20" text-anchor="middle" fill="#c0cdff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.15">PROJECT-AWARE</text>
      <rect x="301" width="137" height="30" rx="15" fill="#ffc86d" fill-opacity=".1" stroke="#ffc86d" stroke-opacity=".32"/>
      <text x="369.5" y="20" text-anchor="middle" fill="#ffdda0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.15">SPEND-SAFE</text>
    </g>
  </g>

  <g transform="translate(664 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="168" height="182" rx="18" fill="#192642" stroke="#6f83bb" stroke-opacity=".48"/>
    <text x="18" y="29" fill="#9baaca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">YOUR PROJECT</text>
    <rect x="18" y="48" width="132" height="48" rx="12" fill="#222f4d"/>
    <circle cx="39" cy="72" r="8" fill="#80e5d6"/>
    <path d="M35 72h8m-4-4v8" stroke="#102233" stroke-width="1.5" stroke-linecap="round"/>
    <text x="56" y="69" fill="#f0f4ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Local app</text>
    <text x="56" y="84" fill="#9caeca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">OpenAI-compatible client</text>
    <path d="M84 106v22" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="m79 124 5 6 5-6" fill="none" stroke="#78dfd2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="137" width="132" height="28" rx="9" fill="#102036" stroke="#6edccf" stroke-opacity=".45"/>
    <text x="84" y="155" text-anchor="middle" fill="#9cece2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">127.0.0.1</text>
  </g>

  <g transform="translate(887 75)" filter="url(#shadow)">
    <rect width="248" height="182" rx="18" fill="#192642" stroke="#6f83bb" stroke-opacity=".48"/>
    <text x="20" y="29" fill="#9baaca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">QUOTAMESH GATEWAY</text>
    <rect x="20" y="46" width="208" height="53" rx="12" fill="#223250" stroke="#87a1ff" stroke-opacity=".36"/>
    <g transform="translate(34 60)" fill="none" stroke="url(#accent)" stroke-width="2">
      <path d="M4 7 15 2l11 8-7 14L4 21z"/>
      <circle cx="4" cy="7" r="2.5" fill="#8fe9db"/><circle cx="15" cy="2" r="2.5" fill="#9aaeff"/>
      <circle cx="26" cy="10" r="2.5" fill="#8fe9db"/><circle cx="19" cy="24" r="2.5" fill="#9aaeff"/>
    </g>
    <text x="83" y="69" fill="#f0f4ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Policy-aware routing</text>
    <text x="83" y="85" fill="#a4b2cc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">One endpoint · explicit rules</text>
    <text x="20" y="125" fill="#a7b5cf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">ELIGIBLE CAPACITY</text>
    <g transform="translate(20 139)">
      <rect width="62" height="25" rx="8" fill="#5ad7bd" fill-opacity=".13" stroke="#5ad7bd" stroke-opacity=".4"/>
      <text x="31" y="16" text-anchor="middle" fill="#91ead5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">FREE</text>
      <rect x="72" width="73" height="25" rx="8" fill="#88a3ff" fill-opacity=".13" stroke="#88a3ff" stroke-opacity=".4"/>
      <text x="108.5" y="16" text-anchor="middle" fill="#bdcaff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">TRIAL</text>
      <rect x="155" width="73" height="25" rx="8" fill="#ffc86d" fill-opacity=".09" stroke="#ffc86d" stroke-opacity=".35"/>
      <text x="191.5" y="16" text-anchor="middle" fill="#ffd995" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600">PAID*</text>
    </g>
  </g>

  <path d="M832 165h42" stroke="url(#accent)" stroke-width="2"/>
  <path d="m866 160 7 5-7 5" fill="none" stroke="#8ce5db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="149" text-anchor="middle" fill="#8f9ebb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" letter-spacing=".5">LOCAL API</text>

  <text x="664" y="291" fill="#8795b0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">North-star product model · phase availability is shown below</text>
  <text x="1136" y="291" text-anchor="end" fill="#8795b0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">* paid access is opt-in</text>
</svg>
