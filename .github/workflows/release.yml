name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on this main commit
        required: true
        default: v0.1.0
      publish:
        description: Publish verified artifacts through the PyPI Trusted Publisher
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_TAG" = v0.1.0
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version']=='0.1.0'"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - run: rm dist/SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@release/v1
  published-acceptance:
    if: inputs.publish
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install httpx
      - run: uvx quotamesh --version
      - run: python scripts/release_smoke.py --package quotamesh==0.1.0
