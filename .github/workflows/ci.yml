name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - uses: astral-sh/setup-uv@v6
      - name: Clean uvx wheel acceptance
        shell: bash
        run: python scripts/release_smoke.py --wheel "$(find dist -name '*.whl' -print -quit)"

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[browser]'
      - run: playwright install --with-deps chromium
      - run: python scripts/check_javascript.py
      - run: python scripts/browser_smoke.py --screenshots output/frontend-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: output/frontend-browser

  clients:
    name: Installed wheel and generated clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install build openai
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: npm install --prefix output/phase-four/node-client --no-audit --no-fund openai @ai-sdk/openai-compatible
      - run: python scripts/integration_smoke.py
